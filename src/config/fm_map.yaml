# M5: map each attack mechanism in data/eval/adversarial_v2.json to the FM code in
# docs/failure_taxonomy.md. Every FM attacked here has >= 3 items in eval set v2.
ticket_over_db: FM-03          # ticket text (injection, false fact, authority claim) overrides DB facts
stale_policy: FM-06            # superseded or not-yet-effective clause used as if current
clause_sum: FM-04              # ship + damage clauses added instead of taking the larger one
double_deduct: FM-05           # prior refund subtracted by the agent before the host caps per order
sibling_refund: FM-07          # money written under another claim of the same order
denied_ignored: FM-02          # host/approval denial ignored, reply says resolved
reply_ledger_mismatch: FM-08   # reply states the quote, ledger holds the capped amount
cross_principal: FM-09         # acting on / leaking another principal's order
